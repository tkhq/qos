name: Release-plz Publish # publish to crates.io

permissions:
  contents: write

on:
  # Run on every push to main. With `release_always = false` in release-plz.toml,
  # release-plz only publishes when the pushed commit comes from a merged release PR.
  push:
    branches: [ main ]

jobs:
  # Publish crates when the release PR is merged.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This environment releases crates and builds
    environment: release
    if: github.repository_owner == 'tkhq'
    permissions:
      contents: write
      # Required for trusted publishing, see https://release-plz.dev/docs/github/quickstart#2-set-the-cargo_registry_token-secret
      id-token: write 
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `fetch-depth: 0` is needed to clone all the git history, which is necessary to
          # release from the latest commit of the release PR.
          fetch-depth: 0
      - name: install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Update apt cache
        run: sudo apt-get update
      - name: Install PCSC deps
        # for verification during cargo publish
        run: sudo apt-get install -y pkg-config libpcsclite-dev
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release
          config: src/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read qos_core release tag
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "qos_core") | .tag')
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  # On a release, build and publish the StageX images and extract the PCRs.
  stagex-release:
    name: Build/publish images for release
    needs: release-plz-release
    if: needs.release-plz-release.outputs.release_tag != ''
    uses: ./.github/workflows/stagex-release.yml
    with:
      release_tag: ${{ needs.release-plz-release.outputs.release_tag }}
    permissions:
      contents: write
      packages: write
      id-token: write # propagate OIDC token scope to the reusable workflow for ECR
    secrets: inherit
