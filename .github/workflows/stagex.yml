name: stagex-build CI # build check for PR and main; push PR images to GHCR/ECR

# Cancel superseded runs for a given PR or branch
concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubicloud-standard-16
    strategy:
      # One job per image so builds/pushes run in parallel. Don't cancel the
      # other images if one fails.
      fail-fast: false
      matrix:
        name:
          - qos_client
          - qos_host
          - qos_host_qemu
          - qos_enclave
          - qos_enclave_egress
          - qos_bridge
          - qos_bridge_qemu
          - qos_bridge_egress
          - signed_echo
        include:
          - name: qos_client
            ghcr: ghcr.io/tkhq/qos_client
            ecr: true
          - name: qos_host
            ghcr: ghcr.io/tkhq/qos_host
            ecr: true
          - name: qos_host_qemu
            ghcr: ghcr.io/tkhq/qos_host_qemu
            ecr: false
          - name: qos_enclave
            ghcr: ghcr.io/tkhq/qos_enclave
            ecr: true
          - name: qos_enclave_egress
            ghcr: ghcr.io/tkhq/qos_enclave_egress
            ecr: true
          - name: qos_bridge
            ghcr: ghcr.io/tkhq/qos_bridge
            ecr: true
          - name: qos_bridge_qemu
            ghcr: ghcr.io/tkhq/qos_bridge_qemu
            ecr: false
          - name: qos_bridge_egress
            ghcr: ghcr.io/tkhq/qos_bridge_egress
            ecr: true
          # signed_echo is an example image with no ECR repository; GHCR only.
          - name: signed_echo
            ghcr: ghcr.io/tkhq/qos/examples/signed_echo
            ecr: false
    permissions:
      contents: read
      packages: write   # needed for pushing PR images to GHCR
      id-token: write   # needed for OIDC auth to assume the AWS role for ECR
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish image
        uses: ./.github/actions/stagex-build
        with:
          image: ${{ matrix.name }}
          ghcr: ${{ matrix.ghcr }}
          ecr: ${{ matrix.ecr }}
          publish: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          metadata: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && matrix.ecr }}
          pr-number: ${{ github.event.pull_request.number }}
          head-commit: ${{ github.event.pull_request.head.sha }}

  # Single aggregate check that branch protection can require (the matrix above
  # produces one check per image). Passes only if every image job succeeded.
  build-artifacts:
    name: build artifacts
    needs: build
    if: always()
    runs-on: ubicloud-standard-2
    steps:
      - name: Verify all image builds succeeded
        run: |
          result="${{ needs.build.result }}"
          if [ "${result}" != "success" ]; then
            echo "One or more image build jobs did not succeed (result: ${result})" >&2
            exit 1
          fi

  qemu-e2e:
    name: QEMU e2e with PR images
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build-artifacts
    uses: ./.github/workflows/qemu-e2e.yml
    with:
      enclave_image: ghcr.io/tkhq/qos_enclave_egress:pr-${{ github.event.number }}
      host_image: ghcr.io/tkhq/qos_host_qemu:pr-${{ github.event.number }}
      bridge_image: ghcr.io/tkhq/qos_bridge_qemu:pr-${{ github.event.number }}
      client_image: ghcr.io/tkhq/qos_client:pr-${{ github.event.number }}
      pivot_image: ghcr.io/tkhq/qos/examples/signed_echo:pr-${{ github.event.number }}
    secrets: inherit

  publish-metadata:
    name: Publish build metadata
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qos-build-metadata-${{ github.run_id }}-*
          path: out/build-metadata
          merge-multiple: true
      - name: Assemble build descriptor
        env:
          QOS_PR_NUMBER: ${{ github.event.pull_request.number }}
          QOS_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          export QOS_TESTED_COMMIT="$(git rev-parse HEAD)"
          bash src/scripts/build_descriptor.sh assemble \
            --fragments out/build-metadata --output out/build-descriptor/qos-build.json
      - name: Upload build descriptor
        id: descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qos-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/build-descriptor/
          if-no-files-found: error
          overwrite: true
      - name: Link build descriptor
        env:
          DESCRIPTOR_URL: ${{ steps.descriptor.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "Build ID: \`pr-${PR_NUMBER}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo "[Download metadata and checksum](${DESCRIPTOR_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::799078726966:role/github-qos
      - name: Publish immutable metadata
        env:
          QOS_PR_NUMBER: ${{ github.event.pull_request.number }}
          QOS_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          aws s3api put-object --generate-cli-skeleton input | jq -e 'has("IfNoneMatch")'
          export QOS_TESTED_COMMIT="$(git rev-parse HEAD)"
          bash src/scripts/publish_build_descriptor.sh out/build-descriptor tkhq-qos-build-metadata
