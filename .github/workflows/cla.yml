# Copy this file to .github/workflows/cla.yml in your repository.
# Add CLA.md at the repository root on the default branch.
# The org secrets CLA_APP_ID and CLA_APP_PRIVATE_KEY must be available to this repository.
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  cla:
    # Only run for tkhq repositories. Run on close only if the PR was merged.
    if: |
      github.repository_owner == 'tkhq' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          (
            github.event.action == 'opened' ||
            github.event.action == 'synchronize' ||
            (github.event.action == 'closed' && github.event.pull_request.merged == true)
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: tkhq/cla-github-action/turnkey@321ca8ad61a09c800d45d56057aeeb1028291b43
        with:
          app-id: ${{ secrets.CLA_APP_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
