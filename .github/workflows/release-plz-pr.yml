name: Release-plz PR Update # create/update release PR on pushes to main

on:
  push: # trigger a release PR update on pushes to main
    branches: [ main ]

jobs:
  # Create or update release PR with the new versions and changelog on pushes to main
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # trigger on pushes to main
    if: >
      github.repository_owner == 'tkhq' &&
      github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      issues: write # needed for labels
    concurrency:
      group: release-plz-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `fetch-depth: 0` is needed to clone all the git history, which is necessary to
          # determine the next version and build the changelog.
          fetch-depth: 0
      - name: install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release-pr
          config: src/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz doesn't update the excluded crates' lockfiles, so ask a human to.
      - name: Comment if excluded crates' lockfiles are stale
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
          PR_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$PR_BRANCH"
          git checkout --detach FETCH_HEAD
          if make -C src check-lockfiles; then
            exit 0
          fi
          marker="<!-- excluded-lockfiles -->"
          if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file - <<EOF
          $marker
          The lockfiles of crates excluded from the workspace are stale, so the release images would fail to build. Refresh them on this branch right before merging:

          \`\`\`bash
          gh pr checkout $PR_NUMBER
          make -C src lockfiles
          git commit -am "chore: refresh excluded crates lockfiles"
          git push
          \`\`\`

          If main moves first, release-plz replaces this PR and the refresh has to be redone on the new one. Whoever pushes the refresh can't be the approver.
          EOF
