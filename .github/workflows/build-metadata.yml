name: Publish build metadata

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to build
        required: true
        type: string

concurrency:
  group: build-metadata-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Resolve source
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_commit: ${{ steps.pr.outputs.head_commit }}
      matrix: ${{ steps.pr.outputs.matrix }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve pull request and image set
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PR number" >&2; exit 1; }
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_commit="$(jq -er --arg repo "${GITHUB_REPOSITORY}" '
            if .head.repo.full_name == $repo and (.head.sha | test("^[0-9a-f]{40}$"))
            then .head.sha else error("Select a pull request from this repository") end
          ' <<< "$pr")"
          echo "head_commit=${head_commit}" >> "${GITHUB_OUTPUT}"
          matrix="$(jq -nc -L src/scripts '
            include "build_descriptor";
            {include: [image_names[] | . as $name | {name: $name, ghcr: (registry_prefixes.ghcr + "/" + $name)}]}
          ')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.name }}
    needs: source
    runs-on: ubicloud-standard-16
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.head_commit }}
          path: build-source
          persist-credentials: false
      - name: Build image and publish metadata
        uses: ./.github/actions/stagex-build
        with:
          image: ${{ matrix.name }}
          ghcr: ${{ matrix.ghcr }}
          ecr: "true"
          publish: "true"
          metadata: "true"
          pr-number: ${{ inputs.pr_number }}
          head-commit: ${{ needs.source.outputs.head_commit }}
          source-directory: build-source

  publish-metadata:
    name: Publish metadata
    needs: [source, build]
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qos-build-metadata-${{ github.run_id }}-*
          path: out/build-metadata
          merge-multiple: true
      - name: Assemble build descriptor
        env:
          QOS_PR_NUMBER: ${{ inputs.pr_number }}
          QOS_HEAD_COMMIT: ${{ needs.source.outputs.head_commit }}
          QOS_TESTED_COMMIT: ${{ needs.source.outputs.head_commit }}
        run: |
          bash src/scripts/build_descriptor.sh assemble \
            --fragments out/build-metadata --output out/build-descriptor/qos-build.json
      - name: Upload build descriptor
        id: descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qos-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/build-descriptor/
          if-no-files-found: error
          overwrite: true
      - name: Link build descriptor
        env:
          DESCRIPTOR_URL: ${{ steps.descriptor.outputs.artifact-url }}
        run: echo "[Download metadata and checksum](${DESCRIPTOR_URL})" >> "${GITHUB_STEP_SUMMARY}"
