on:
  push:
    branches:
      - main
    paths:
      - src/images/linux_nitro/**
      - src/scripts/verify_kernel_source.sh
      - .github/workflows/kernel-source.yml
  pull_request:
    paths:
      - src/images/linux_nitro/**
      - src/scripts/verify_kernel_source.sh
      - .github/workflows/kernel-source.yml

name: kernel-source

jobs:
  verify-signature:
    name: verify kernel source signature
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify kernel tarball against maintainer signature
        run: src/scripts/verify_kernel_source.sh
