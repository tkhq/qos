[package]
name = "qos_hex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Utilities for encoding and decoding hex strings"
repository = "https://github.com/tkhq/qos"
keywords = ["quorumos", "hex", "encoding"]
categories = ["encoding"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[features]
# serde/alloc is required for the String impls used by our serializers; without
# it, building with only `--features serde` (no unification from other
# workspace crates enabling serde/std) fails.
serde = ["dep:serde", "serde/alloc"]
