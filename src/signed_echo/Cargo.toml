[package]
name = "signed_echo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json", "query"], default-features = false }
qos_attestation = { workspace = true, features = ["cache"] }
qos_core = { workspace = true }
qos_hex = { workspace = true }
qos_json = { workspace = true }
qos_nsm = { workspace = true }
qos_p256 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
ureq = { workspace = true, features = ["tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }
