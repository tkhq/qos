[package]
name = "init"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
libc = "0.2.180"
nix = { version = "0.30.1", features = ["ioctl"]}
qos_aws = { path = "../qos_aws"}
qos_system = { path = "../qos_system"}
qos_core = { path = "../qos_core", features = ["vm"], default-features = false }
qos_nsm = { path = "../qos_nsm", default-features = false }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"], default-features = false }
oci-spec = { version = "0.9", features = ["runtime"], default-features = false, optional = true }

[features]
qemu-stagex-e2e = ["dep:oci-spec"]

[[bin]]
name = "init"
path = "init.rs"

[patch.crates-io]
libcontainer = { path = "../../vendor/libcontainer" }
