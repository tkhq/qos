[package]
name = "qos_attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-attestation, verification and caching for QuorumOS pivots"
repository = "https://github.com/tkhq/qos"
readme = "README.md"
keywords = ["quorumos", "nitro", "enclave", "attestation", "aws"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
qos_core = { workspace = true, default-features = false }
qos_crypto = { workspace = true }
qos_nsm = { workspace = true, default-features = false }
aws-nitro-enclaves-nsm-api = { workspace = true }
thiserror = { workspace = true }
x509-cert = { workspace = true }

tokio = { workspace = true, features = ["rt", "sync", "time"], default-features = false, optional = true }

[dev-dependencies]
aws-nitro-enclaves-cose = { workspace = true }
qos_nsm = { workspace = true, features = ["mock"], default-features = false }
qos_p256 = { workspace = true }
qos_test_primitives = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"], default-features = false }

[features]
# Attestation cache with background refresh
cache = ["dep:tokio"]
# Never use in production - adds verification that skips the certificate
# chain and signature, for emulated NSMs (QEMU) that don't sign documents
unsafe-verifier = []
