[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
missing_docs = "allow"
unsafe_code = "deny"

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[dependencies]
integration = { workspace = true }
qos_core = { workspace = true, features = ["mock"], default-features = false }
qos_p256 = { workspace = true, features = ["mock"] }
qos_crypto = { workspace = true }
qos_hex = { workspace = true }
zeroize = { workspace = true }
vfaas-abi = { workspace = true }
# The typed contracts for the demo functions: the client encodes requests
# against the exact crates the enclave runs.
vfaas_fee_calculator = { path = "../vfaas/examples/fee-calculator" }
vfaas_sanctions_screening = { path = "../vfaas/examples/sanctions-screening" }

borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
# tls: the --url endpoint mode drives a TVC-deployed pivot over https
ureq = { workspace = true, features = ["json", "tls"] }
clap = { version = "4.5", features = ["derive"] }
