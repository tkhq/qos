[package]
name = "qos_enclave"
version = "1.2.0"
authors = [""]
rust-version = "1.97"
edition = "2024"
publish = false

[dependencies]
nitro-cli = { package = "aws-nitro-enclaves-cli", version = "1.5.2" }
libc = "=0.2.174"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt"] }

[dev-dependencies]
serde_json = "1"

[features]
default = []
