[package]
name = "qos_p256"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signing and encryption utilities for P-256 keys"
repository = "https://github.com/tkhq/qos"
readme = "README.md"
keywords = ["quorumos", "p256", "ecdsa", "ecdh", "encryption"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
qos_hex = { workspace = true }

borsh = { workspace = true }
serde = { workspace = true, features = ["alloc"] }

sha2 = { workspace = true }
getrandom = { workspace = true }
p256 = { workspace = true, features = ["ecdh", "ecdsa", "std"] }
aes-gcm = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
qos_test_primitives = { path = "../qos_test_primitives" }

[features]
# Things to make writing tests easier
mock = []
